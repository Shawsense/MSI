#
# Clash Subscription Conversion Configuration File
# Version: 3.1 - Final Customized Version for Shawsense
# Description: 精细化分流配置，增加了对Windows系统核心连接的直连规则，
# 保证开机和网络验证的稳定性，同时为上层应用提供精细化代理策略。
#

[General]
# 1. 订阅链接，请将 YOUR_SUBSCRIPTION_LINK_HERE 替换为你自己的Clash订阅链接
# url = YOUR_SUBSCRIPTION_LINK_HERE

# 2. 客户端类型
client = Clash

# 3. 生成的文件名
fileName = Shawsense_Clash_Config

# 4. 远程规则集 - 引用社区维护的、分类精细的规则库
remote-rules = https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/ruleset.ini,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/special.ini

# 5. 其他常规选项
emoji = true
udp = true
clash-new-field = true

[Proxy Group]
# 策略组是实现精细化分流的核心。
PROXY = select, auto
GoogleSearch = select, PROXY
MicrosoftWeb = select, PROXY
AppleService = select, PROXY
Streaming = select, PROXY
Social = select, PROXY

[Rule]
# 规则顺序至关重要！Clash 会从上到下匹配，一旦匹配成功则不再继续。

# --- 新增: Windows 核心连接服务 ---
# 这是最高优先级的应用规则，确保系统网络状态检测和时间同步永远直连。
DOMAIN,www.msftconnecttest.com,DIRECT
DOMAIN,www.msftncsi.com,DIRECT
DOMAIN,time.windows.com,DIRECT
DOMAIN,time.nist.gov,DIRECT

# --- 广告屏蔽 ---
RULE-SET,advertising,REJECT
RULE-SET,applications,REJECT

# --- 要求 5: Google 首页分流 ---
DOMAIN,www.google.com,GoogleSearch
DOMAIN,www.google.com.hk,GoogleSearch
DOMAIN,www.google.com.tw,GoogleSearch
DOMAIN,www.google.co.jp,GoogleSearch

# --- 要求 4: 重点服务分流 ---
RULE-SET,openai,Social
RULE-SET,telegram,Social
RULE-SET,twitter,Social
RULE-SET,google-voice,Social
RULE-SET,youtube,Streaming
RULE-SET,adult,PROXY

# --- 要求 1: 微软服务分流 ---
RULE-SET,onedrive,DIRECT
RULE-SET,windows-update,DIRECT
RULE-SET,microsoft,MicrosoftWeb

# --- 要求 3: Apple 服务分流 ---
RULE-SET,apple-cn,DIRECT
RULE-SET,apple,AppleService

# --- 其他常规分流规则 ---
RULE-SET,private,DIRECT
RULE-SET,cn,DIRECT
GEOIP,CN,DIRECT
RULE-SET,gfw,PROXY
MATCH,PROXY
