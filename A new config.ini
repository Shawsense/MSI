#
# Clash Subscription Conversion Configuration File
# Version: 4.0 - Replicated & Fixed for Shawsense
# Description: 1:1 复刻并修复用户原有配置结构，确保在 bianyuan.xyz 等网站上能生成预期的复杂分组效果。
# 解决了 OneDrive/系统连接/Apple/Google 等所有问题。
#

[General]
# 配置文件名
fileName = Shawsense_Final_Clash_Config

# 以下是关键的节点偏好设置，可以不动
# sort-by = rtt
# node_pref = (?i)IEPL|IPLC|专线|BGP|回国

[Proxy Group]
# --- 基础节点策略 (对应您截图中的自动和手动分组) ---
香港自动 = url-test, include-all-regex=(?i)HK|港|Hong Kong, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50
日本自动 = url-test, include-all-regex=(?i)JP|日|Japan, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50
美国自动 = url-test, include-all-regex=(?i)US|美|United States, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50
台湾自动 = url-test, include-all-regex=(?i)TW|台|Taiwan, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50
狮城自动 = url-test, include-all-regex=(?i)SG|狮|Singapore, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50
韩国自动 = url-test, include-all-regex=(?i)KR|韩|Korea, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50

香港手动 = select, include-all-regex=(?i)HK|港|Hong Kong, exclude-all-regex=(?i)流量|剩余|到期|官网|时间
日本手动 = select, include-all-regex=(?i)JP|日|Japan, exclude-all-regex=(?i)流量|剩余|到期|官网|时间
美国手动 = select, include-all-regex=(?i)US|美|United States, exclude-all-regex=(?i)流量|剩余|到期|官网|时间
台湾手动 = select, include-all-regex=(?i)TW|台|Taiwan, exclude-all-regex=(?i)流量|剩余|到期|官网|时间
狮城手动 = select, include-all-regex=(?i)SG|狮|Singapore, exclude-all-regex=(?i)流量|剩余|到期|官网|时间
韩国手动 = select, include-all-regex=(?i)KR|韩|Korea, exclude-all-regex=(?i)流量|剩余|到期|官网|时间

# --- 自定义策略组 (对应您截图中的特殊线路分组) ---
节点选择 = select, PROXY, 香港自动, 日本自动, 美国自动, 台湾自动, 狮城自动, 韩国自动
手动选择 = select, PROXY, 香港手动, 日本手动, 美国手动, 台湾手动, 狮城手动, 韩国手动
自动切换 = url-test, PROXY, interval=300, tolerance=50
单倍线路 = url-test, include-all-regex=(?i)x1|1倍, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50
亚太快连 = url-test, include-all-regex=(?i)HK|JP|SG|TW|KR|港|日|狮|台|韩, exclude-all-regex=(?i)流量|剩余|到期|官网|时间, interval=300, tolerance=50

# --- 应用/服务策略组 (核心分流部分) ---
# 每个服务都可以独立选择使用上面的哪个策略组
广告拦截 = select, REJECT, PROXY
应用净化 = select, REJECT, PROXY
全球直连 = select, DIRECT
全球拦截 = select, REJECT
漏网之鱼 = select, 节点选择, PROXY, DIRECT

# 以下是您最关心的自定义服务分组
微软云盘 = select, 香港自动, 日本自动, 美国自动, 台湾自动, 狮城自动, 韩国自动, DIRECT
微软服务 = select, 美国手动, 香港手动, 日本手动, 台湾手动, 狮城手动, 韩国手动
苹果服务 = select, DIRECT, 节点选择
游戏平台 = select, DIRECT, 节点选择
网易音乐 = select, DIRECT, 节点选择

电报消息 = select, 节点选择, 手动选择
OpenAi = select, 手动选择, 节点选择
Gemini = select, 节点选择, 手动选择
Claude = select, 手动选择, 节点选择
GoogleVoice = select, 手动选择, 节点选择
推特内容 = select, 手动切换, 节点选择
草榴社区 = select, 香港自动, 节点选择
谷歌首页 = select, 香港自动, 节点选择
油管视频 = select, 单倍线路, 亚太快连, 节点选择
油管音乐 = select, 美国手动, 节点选择

奈飞视频 = select, 节点选择, 手动选择
巴哈姆特 = select, 台湾自动, 节点选择
哔哩哔哩 = select, 全球直连

国外媒体 = select, 节点选择, 手动选择
国内媒体 = select, 全球直连, DIRECT
谷歌FCM = select, DIRECT

[Rule]
# 规则顺序: 高优先级 → 精确应用 → 区域 → 最终匹配

# 1. 系统核心服务 (新增，最高优先级，保证系统稳定)
DOMAIN,www.msftconnecttest.com,DIRECT
DOMAIN,www.msftncsi.com,DIRECT
DOMAIN,time.windows.com,DIRECT
DOMAIN,time.nist.gov,DIRECT

# 2. 广告、应用净化
RULE-SET,applications,应用净化
RULE-SET,advertising,广告拦截

# 3. 谷歌首页单独控制 (修复)
DOMAIN,www.google.com,谷歌首页
DOMAIN,www.google.com.hk,谷歌首页
DOMAIN,www.google.com.tw,谷歌首页
DOMAIN,www.google.co.jp,谷歌首页

# 4. 微软 & Apple 服务分流 (修复)
RULE-SET,onedrive,DIRECT                 # OneDrive 强制直连
RULE-SET,windows-update,DIRECT          # Windows Update 强制直连
RULE-SET,microsoft,微软服务               # 其他微软服务走“微软服务”组
RULE-SET,apple-cn,DIRECT                # Apple国内服务直连
RULE-SET,apple,苹果服务                 # 其他Apple服务走“苹果服务”组

# 5. 您关心的其他所有应用和服务
RULE-SET,bilibili,哔哩哔哩
RULE-SET,netflix,奈飞视频
RULE-SET,youtube,油管视频
RULE-SET,google-voice,GoogleVoice
RULE-SET,google,谷歌首页                 # 其他谷歌服务也引导至首页组，避免干扰
RULE-SET,telegram,电报消息
RULE-SET,twitter,推特内容
RULE-SET,openai,OpenAi
RULE-SET,netease-music,网易音乐
RULE-SET,gamer,巴哈姆特
RULE-SET,adult,草榴社区

# 6. 媒体分流
RULE-SET,cn-media,国内媒体
RULE-SET,global-media,国外媒体

# 7. 兜底规则
RULE-SET,private,DIRECT
RULE-SET,cn,DIRECT
GEOIP,CN,DIRECT
MATCH,漏网之鱼
